name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only the latest commit per branch/PR needs to run — cancel superseded runs so the
# self-hosted runner is never busy validating a commit that's already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast compile check on a GitHub-hosted runner (free for this public repo). Fails in ~2-3 min
  # on a real code break and — just as important — tells a genuine failure apart from a
  # self-hosted-runner hiccup. The full test suite still runs below.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MCAROC.Portal/MCAROC.Portal.slnx

      - name: Build (Release)
        run: dotnet build MCAROC.Portal/MCAROC.Portal.slnx --no-restore --configuration Release

  # Full suite on the self-hosted runner: it has SQL Server Express (the integration tests hit
  # .\SQLEXPRESS directly), Tesseract OCR, and the two real reconciliation workbooks that are
  # never committed. Gated on `build` so the loaded dev box never runs a suite that can't compile.
  test:
    needs: build
    runs-on: [self-hosted, windows, mcaroc]
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-dotnet: this runner is non-admin and can't write to C:\Program Files\dotnet.
      # The .NET 10 SDK is already installed and on PATH.
      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore MCAROC.Portal/MCAROC.Portal.slnx

      - name: Build
        run: dotnet build MCAROC.Portal/MCAROC.Portal.slnx --no-restore --configuration Release

      - name: Test
        # MCAROC_RECON_FIXTURES points SourceReconciliationTests at the two real .xls workbooks
        # (U45203OR1995PLC003982{,-charge}.xls) on this runner, so the BFSI reconciliation actually
        # runs in CI without the real company data ever being committed. Override with the repo
        # variable RECON_FIXTURES_DIR; if the files aren't there the test skips (it never fails CI).
        env:
          MCAROC_RECON_FIXTURES: ${{ vars.RECON_FIXTURES_DIR || 'E:\Downloads' }}
        run: dotnet test MCAROC.Portal/MCAROC_Analysis.Tests/MCAROC_Analysis.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        # Archiving the .trx is a convenience, not a gate: only bother when a test failed, and never let
        # the upload itself turn the run red (e.g. the account's Actions storage quota is exhausted).
        if: failure()
        continue-on-error: true
        with:
          name: test-results
          path: MCAROC.Portal/MCAROC_Analysis.Tests/TestResults/test-results.trx
          retention-days: 7
