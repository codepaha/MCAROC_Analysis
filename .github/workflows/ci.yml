name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only the latest commit per branch/PR needs to run — cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full suite on a GitHub-hosted runner — free and parallel across PRs now the repo is public.
  # It stands up SQL Server LocalDB for the integration tests. The real-workbook reconciliation
  # tests skip here (their fixtures are never committed); they run on `reconciliation` below.
  build-and-test:
    runs-on: windows-2022
    env:
      MCAROC_TEST_CONNECTION: "Server=(localdb)\\MSSQLLocalDB;Database=MCAROC_Analysis_Test;Trusted_Connection=True;TrustServerCertificate=True;"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore
        run: dotnet restore MCAROC.Portal/MCAROC.Portal.slnx

      - name: Build (Release)
        run: dotnet build MCAROC.Portal/MCAROC.Portal.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MCAROC.Portal/MCAROC_Analysis.Tests/MCAROC_Analysis.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: test-results
          path: MCAROC.Portal/MCAROC_Analysis.Tests/TestResults/test-results.trx
          retention-days: 7

  # Self-hosted only: the two real COASTAL .xls workbooks live on this machine and are never
  # committed. Runs just the fixture-dependent reconciliation tests, in parallel with the job above.
  reconciliation:
    runs-on: [self-hosted, windows, mcaroc]
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-dotnet: this runner is non-admin and can't write to C:\Program Files\dotnet.
      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore MCAROC.Portal/MCAROC.Portal.slnx

      - name: Build
        run: dotnet build MCAROC.Portal/MCAROC.Portal.slnx --no-restore --configuration Release

      - name: Reconciliation tests (real workbooks)
        # MCAROC_RECON_FIXTURES points SourceReconciliationTests at the two real .xls workbooks on
        # this runner. Override the location with the repo variable RECON_FIXTURES_DIR; the tests
        # skip (never fail) if the files are absent.
        env:
          MCAROC_RECON_FIXTURES: ${{ vars.RECON_FIXTURES_DIR || 'E:\Downloads' }}
        run: dotnet test MCAROC.Portal/MCAROC_Analysis.Tests/MCAROC_Analysis.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~SourceReconciliation"
