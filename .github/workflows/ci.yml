name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only the latest commit per branch/PR needs to run — cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full suite on a GitHub-hosted runner — free and parallel across PRs now the repo is public.
  # The app stores embeddings in a SQL Server 2025 `vector(768)` column, so CI runs against a real
  # SQL Server 2025 container (LocalDB / SQL 2019 on the hosted images does not have the vector type).
  # The .NET app is cross-platform; only QuestPDF needs a native font lib on Linux.
  # The real-workbook reconciliation tests and the dossier PDF text-extraction assertions skip here
  # (no committed fixtures; PdfPig can't read Linux subset fonts) — see the `windows-tests` job.
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Local_Pass1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Local_Pass1' -Q 'SELECT 1' -b -o /dev/null"
          --health-start-period 15s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MCAROC_TEST_CONNECTION: "Server=localhost,1433;Database=MCAROC_Analysis_Test;User Id=sa;Password=Ci_Local_Pass1;TrustServerCertificate=True;"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Run JavaScript unit tests
        run: node --test MCAROC.Portal/MCAROC_Analysis.Tests/js/*.test.js

      - name: QuestPDF native dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1

      - name: Restore
        run: dotnet restore MCAROC.Portal/MCAROC.Portal.slnx

      - name: Build (Release)
        run: dotnet build MCAROC.Portal/MCAROC.Portal.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MCAROC.Portal/MCAROC_Analysis.Tests/MCAROC_Analysis.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: test-results
          path: MCAROC.Portal/MCAROC_Analysis.Tests/TestResults/test-results.trx
          retention-days: 7

  # Self-hosted Windows: the parts the Linux job above cannot cover, run in parallel with it.
  #  * The two real COASTAL .xls workbooks live on this machine and are never committed —
  #    SourceReconciliationTests need them.
  #  * The dossier PDF text-extraction assertions: SkiaSharp's font subsetting on Linux drops the
  #    ToUnicode data PdfPig needs, so those assertions only run truthfully on Windows.
  windows-tests:
    runs-on: [self-hosted, windows, mcaroc]
    # This runner's integration tests share one SQLEXPRESS instance. The applock in TestDatabase.cs
    # coordinates callers running this same, current code, but cannot coordinate an old/uncoordinated
    # local checkout or a leftover local test process on this machine hammering the same fixed database
    # name (root-caused live on this exact PR: three consecutive hosted runs failed identically with
    # "Database already exists" from inside EF's own MigrateAsync, for ~100s across ~27 tests — the
    # signature of a persistent colliding process, not a short creation race the applock already
    # handles). Fix: this job never touches the shared MCAROC_Analysis_Test name at all — every run gets
    # its own catalog, so no other process (CI or local) can ever collide with it again. cancel-in-progress
    # stays false so an active validation is allowed to finish.
    concurrency:
      group: mcaroc-self-hosted-sqlexpress-tests
      cancel-in-progress: false
    env:
      # Unique per run+attempt, never reused — a re-run of the same run gets a fresh attempt number, so
      # a prior attempt's (possibly still-cleaning-up) database is never revisited either.
      MCAROC_TEST_CATALOG: MCAROC_Analysis_CI_${{ github.run_id }}_${{ github.run_attempt }}
      MCAROC_TEST_CONNECTION: 'Server=.\SQLEXPRESS;Database=MCAROC_Analysis_CI_${{ github.run_id }}_${{ github.run_attempt }};Trusted_Connection=True;TrustServerCertificate=True;Encrypt=False;'
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-dotnet: this runner is non-admin and can't write to C:\Program Files\dotnet.
      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore MCAROC.Portal/MCAROC.Portal.slnx

      - name: Build
        run: dotnet build MCAROC.Portal/MCAROC.Portal.slnx --no-restore --configuration Release

      - name: Reconciliation + PDF text-extraction tests
        # MCAROC_RECON_FIXTURES points SourceReconciliationTests at the two real .xls workbooks on
        # this runner. Override the location with the repo variable RECON_FIXTURES_DIR; the tests
        # skip (never fail) if the files are absent. MCAROC_TEST_CONNECTION (job env, above) points
        # every test in this run at its own run-scoped database — see the concurrency block's comment.
        env:
          MCAROC_RECON_FIXTURES: ${{ vars.RECON_FIXTURES_DIR || 'E:\Downloads' }}
        run: dotnet test MCAROC.Portal/MCAROC_Analysis.Tests/MCAROC_Analysis.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~SourceReconciliation|FullyQualifiedName~DossierFontsTests|FullyQualifiedName~DossierPdfComposerTests"

      - name: Drop this run's scoped test database
        # Always runs, even if the test step failed, so a run-scoped database never lingers. Validates
        # the CI-generated prefix before dropping anything, on principle — MCAROC_TEST_CATALOG is built
        # entirely from this job's own env above, never external input, but the check costs nothing and
        # makes it impossible for this step to ever target the shared MCAROC_Analysis_Test database (or
        # anything else) by a future refactor accidentally widening what it points at.
        if: always()
        shell: pwsh
        run: |
          $dbName = $env:MCAROC_TEST_CATALOG
          if ($dbName -notlike 'MCAROC_Analysis_CI_*') {
            throw "Refusing to drop '$dbName' — does not match the expected CI-run-scoped prefix."
          }
          sqlcmd -S ".\SQLEXPRESS" -d master -Q "IF DB_ID(N'$dbName') IS NOT NULL BEGIN ALTER DATABASE [$dbName] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [$dbName]; END"
